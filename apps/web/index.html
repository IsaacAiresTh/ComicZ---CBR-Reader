<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d12" />
    <title>ComicZ — leia HQs sem saber por onde começar</title>
    <!--
      Icone da aba: o SVG vale para os navegadores atuais e escala sem perder o
      traco; o PNG de 32 px cobre os que nao leem SVG. O de 180 px e o que o
      iPhone usa ao adicionar o site a tela inicial, e o manifesto faz o mesmo
      no Android.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!--
      As familias de display. A Bangers ja era o --font-display do tema e nunca
      foi carregada: caia no Impact sem avisar ninguem. As outras quatro sao as
      escolhas de estilo por personagem, e vem no mesmo pedido — sao fontes de
      titulo, usadas em uma linha por pagina.

      preconnect antes do link porque o arquivo .woff2 mora em outro dominio
      (gstatic) que so e descoberto depois do CSS chegar; sem ele o texto pisca
      na fonte de sistema por um tempo a mais.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bangers&family=Cinzel:wght@700&family=Metal+Mania&family=Orbitron:wght@700&family=Special+Elite&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
