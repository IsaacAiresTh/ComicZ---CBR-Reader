name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, testes e build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Usar o proprio template garante que ele continue completo: se alguem
      # adicionar uma variavel obrigatoria e esquecer do .env.example, o CI quebra.
      - name: Preparar .env a partir do template
        run: cp .env.example .env

      # Valida o schema e emite o client. Nao abre conexao: nenhum banco sobe aqui.
      - name: Gerar o Prisma Client
        run: npm run db:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build
