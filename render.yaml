# Blueprint da API. O worker NAO esta aqui de proposito: o free instance do
# Render cobre apenas web services, e o processamento de CBR roda na maquina do
# admin ate existir orcamento (ver docs/DEPLOY.md).
services:
  - type: web
    name: comicz-api
    runtime: node
    plan: free
    # Mesma regiao do Neon (AWS us-east-2): a API conversa com o banco varias
    # vezes por requisicao, entao colocar os dois juntos vale mais do que os
    # ~20ms a menos que Virginia daria ao navegador brasileiro.
    region: ohio
    branch: main
    # O rewrite da Vercel aponta para <name>.onrender.com: se voce renomear o
    # servico, atualize o destination em vercel.json.
    # --include=dev e obrigatorio: o Render define NODE_ENV=production, e com
    # isso o npm pula as dependencias marcadas como dev no lockfile — entre elas
    # o @nestjs/cli, sem o qual o `nest build` nao existe. So o runtime dispensa
    # as devDependencies; o build precisa delas.
    buildCommand: npm ci --include=dev && npm run build:api && npm run db:deploy
    startCommand: npm run start:api
    # Rota @Public() e barata, sem banco: serve de health check sem furar o guard.
    healthCheckPath: /api/v1/config
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      - key: API_PREFIX
        value: api/v1
      # navegador -> Vercel -> Render -> Node. Ver TRUST_PROXY em configuration.ts.
      - key: TRUST_PROXY
        value: '2'
      # O disco do free instance e efemero: some no proximo deploy ou
      # spin-down. O upload aterrissa nele antes de subir para o R2, entao o
      # limite existe para o arquivo em transito caber.
      - key: MAX_UPLOAD_MB
        value: '200'
      # Com 'local' a API sobe mas serve 404 em toda imagem, porque o disco do
      # free instance nao e o mesmo do worker. As quatro variaveis abaixo
      # precisam estar preenchidas no dashboard antes desta virar 's3': sem
      # elas a API se recusa a subir, de proposito, em vez de servir 404 em
      # silencio.
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      # Nao e segredo: e o dominio publico do front. Fica aqui, e nao no
      # dashboard, para haver uma fonte de verdade so. Serve o CORS das
      # chamadas que nao passam pelo rewrite da Vercel.
      - key: WEB_ORIGIN
        value: https://comicz-zeta.vercel.app
      # Esta sim e segredo: preenchida no dashboard.
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: PAGE_TOKEN_SECRET
        generateValue: true
